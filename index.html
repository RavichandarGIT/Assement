<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- Inline SVG Favicon to prevent 404 errors -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z'/></svg>" />
  <!-- Google Fonts: Inter and IBM Plex Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- SheetJS for Excel Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Top Bar Navigation Header -->
    <header class="topbar">
      <!-- Left: Brand Logo & Title -->
      <div class="brand">
        <div class="logo-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Apparel Ratio Manager</h1>
          <span class="sub">Catalogue · Cart · Grade Ratios</span>
        </div>
      </div>

      <!-- Center: Segmented Navigation Pills -->
      <nav class="nav-pills-center" aria-label="Main Navigation">
        <button class="nav-pill active tab-btn" data-tab="catalogue" aria-label="Catalogue tab">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span class="nav-pill-title">Catalogue</span>
          <span class="pill-badge" id="catalogueBadge">5</span>
        </button>

        <button class="nav-pill tab-btn" data-tab="cart" aria-label="Cart tab">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="nav-pill-title">Cart</span>
          <span class="pill-badge" id="cartBadge">0</span>
        </button>
      </nav>

      <!-- Right: Action Buttons & Upload -->
      <div class="topbar-actions">
        <button class="btn accent-btn" id="openRatioModalBtn" title="Set Grade-wise size ratios" aria-label="Input Ratio">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <span class="btn-text">Input Ratio</span>
        </button>

        <!-- Sample Data Dropdown Menu -->
        <div class="dropdown-wrapper">
          <button class="btn secondary-btn" id="sampleDataDropdownBtn" aria-expanded="false" aria-label="Sample Data Options">
            <span class="btn-text">Sample Data</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left: 2px;">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="dropdown-popover" id="sampleDataPopover">
            <button class="dropdown-item" id="loadSampleBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 4v6h-6M1 20v-6h6"></path>
                <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
              </svg>
              Restore Sample Catalogue
            </button>
            <button class="dropdown-item" id="downloadSampleBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"></path>
              </svg>
              Download Sample Excel (.xlsx)
            </button>
            <button class="dropdown-item" id="clearDataBtn" style="color: #F87171;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
              </svg>
              Clear Catalogue & Cart
            </button>
          </div>
        </div>

        <label class="btn primary-btn" for="fileInput" aria-label="Upload Excel File">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
          </svg>
          <span class="btn-text">Upload Excel</span>
        </label>
        <input type="file" id="fileInput" name="fileInput" accept=".xlsx,.xls,.csv" aria-label="Upload Excel Catalogue File" />
      </div>
    </header>

    <!-- Main Content Container -->
    <div class="main-layout">
      <!-- Toolbar / Filters -->
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="search-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            </svg>
            <label for="searchBox" class="visually-hidden">Search products</label>
            <input type="text" id="searchBox" name="searchBox" placeholder="Search by name, code or print..." aria-label="Search products by name, code or print" />
          </div>
          <label for="gradeFilter" class="visually-hidden">Filter by Grade</label>
          <select id="gradeFilter" name="gradeFilter" aria-label="Filter products by Grade">
            <option value="ALL">All Grades</option>
            <option value="A">Grade A</option>
            <option value="B">Grade B</option>
            <option value="C">Grade C</option>
          </select>
        </div>

        <div class="toolbar-right" id="catalogueActions">
          <button class="btn primary-btn" id="addSelectedToCartBtn">
            Add Selected to Cart (<span id="selectedCount">0</span>)
          </button>
        </div>
        <div class="toolbar-right" id="cartActions" style="display: none;">
          <span class="items-count" id="itemsCount">0 Items in Cart</span>
        </div>
      </div>

      <!-- Views Container -->
      <main id="viewsContainer">
        <!-- Cart View -->
        <div class="view-panel" id="cartView" style="display: none;">
          <div class="cards-container" id="cartCardsContainer">
            <!-- Rendered dynamically by app.js -->
          </div>
        </div>

        <!-- Catalogue View (Default Active) -->
        <div class="view-panel" id="catalogueView">
          <div class="catalogue-grid" id="catalogueGrid">
            <!-- Rendered dynamically by app.js -->
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Input Ratio Modal / Drawer -->
  <div class="modal-backdrop" id="ratioModalBackdrop">
    <div class="ratio-modal" id="ratioModal">
      <!-- Mobile Bottom Sheet Handle -->
      <div class="bottom-sheet-handle" aria-hidden="true"></div>

      <!-- Modal Header -->
      <div class="ratio-modal-header">
        <div>
          <h2>Input Ratio</h2>
          <span class="modal-subtitle">Set Grade-wise ratios at different attribute levels</span>
        </div>
        <button class="icon-close-btn" id="closeRatioModalBtn" aria-label="Close Input Ratio Modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Ratio Level Attribute Selector (Req 4) -->
      <div class="ratio-level-bar">
        <label for="ratioLevelSelect">Ratio Level:</label>
        <select id="ratioLevelSelect" name="ratioLevelSelect" aria-label="Select Ratio Level Attribute">
          <option value="Category">Category</option>
          <option value="Brick">Brick</option>
          <option value="Brick+Neck">Brick + Neck</option>
          <option value="Brick+Sleeve" selected>Brick + Sleeve</option>
        </select>
      </div>

      <!-- Grouped Accordion Content -->
      <div class="ratio-modal-body" id="ratioModalBody">
        <!-- Dynamic attribute group blocks rendered by JS -->
      </div>

      <!-- Modal Footer -->
      <div class="ratio-modal-footer">
        <button class="btn btn-reset-ratio" id="resetRatioBtn">Reset Ratio</button>
        <button class="btn btn-set-ratio" id="setRatioBtn">Save / Set Ratio</button>
      </div>
    </div>
  </div>

  <!-- Excel Column Mapping Modal -->
  <div class="modal-backdrop" id="mappingModalBackdrop">
    <div class="mapping-modal" id="mappingModal">
      <!-- Populated by app.js -->
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
